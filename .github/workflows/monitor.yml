name: Poll internships

# Cadence lives here, not in the app. `run-once` polls whenever it is invoked;
# these schedules decide when. Times are UTC — GitHub cron has no timezone and
# no DST awareness, so the windows below are deliberately a little wider than
# needed and drift by an hour when US daylight saving flips.
on:
  schedule:
    # Minute 17, never :00. Every cron on GitHub fires at :00, and scheduled
    # runs on free/public repos are dropped rather than queued under load —
    # at :00 we observed 3 of 4 runs silently never happen.
    - cron: '17 13-23 * * 1-5'           # weekdays hourly, ~9am-7pm ET
    - cron: '17 0-3 * * 2-6'             # weekday evenings hourly, ~8-11pm ET
    - cron: '17 4,8 * * *'               # overnight, every 4h
    - cron: '17 0,4,8,12,16,20 * * 0,6'  # weekends, every 4h
  workflow_dispatch:                     # manual "Run workflow" button

# Never let two polls run at once — they would race on the state DB and on the
# cache entry that carries it between runs.
concurrency:
  group: poll-internships
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Each run saves a new cache entry and restores the newest previous one.
      # Cache keys are immutable, hence run_id in the key: a fixed key would
      # pin the DB to its first-ever version and silently stop persisting state.
      - name: Restore state DB
        uses: actions/cache@v4
        with:
          path: monitor.db
          key: monitor-db-${{ github.run_id }}
          restore-keys: monitor-db-

      # Without this the job goes green while every alert silently fails to
      # deliver — the one failure mode a scheduled monitor cannot afford.
      - name: Verify alert channel is configured
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "::error::DISCORD_WEBHOOK_URL is not set. Alerts would go nowhere."
            exit 1
          fi
          echo "Discord webhook present (${#DISCORD_WEBHOOK_URL} chars)."

      - name: Poll
        env:
          MONITOR_DB_PATH: monitor.db
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          POLL_WORKERS: '4'
          POLL_DOMAIN_MAX_CONCURRENT: '2'
          # Only alert on Simplify listings the source says were posted within
          # 3 days. Direct company boards report no publish date and are
          # unaffected — for those, "newly appeared since last poll" already
          # means posted within the hour.
          MAX_NEW_LISTING_AGE_DAYS: '3'
        run: python cli.py run-once
